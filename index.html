<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splashworks Tycoon</title>
<meta name="description" content="An isometric water park tycoon game. Build pools, slides and stalls, hire staff and keep guests happy.">
<meta name="theme-color" content="#7fd6e8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 30 30%22%3E%3Ccircle cx=%2215%22 cy=%2215%22 r=%2213%22 fill=%22%23ffd23f%22 stroke=%22%230d3b4f%22 stroke-width=%222.5%22/%3E%3Cpath d=%22M3.5 18c3 0 3-2.4 5.8-2.4S12.4 18 15 18s3-2.4 5.8-2.4S24 18 26.5 18v1.5a12 12 0 0 1-23 0z%22 fill=%22%231495b8%22 stroke=%22%230d3b4f%22 stroke-width=%222%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: full-bleed isometric park canvas, sticker-style HUD chips on top, build dock along the bottom, inspector card on the right */
:root{
  --ink:#0d3b4f; --paper:#fffdf7; --sea:#7fd6e8; --lagoon:#1495b8; --coral:#ff5f57;
  --sun:#ffd23f; --leaf:#2f9e5b; --muted:#587684; --good:#1f9457; --bad:#d93b33; --warn:#e88a12;
  --line:#cfe6ec;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --hudH:70px;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--sea);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:default}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  padding-block:calc(env(safe-area-inset-top,0px) + 10px) 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;color:var(--paper);
  -webkit-text-stroke:0;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 3px 0 var(--ink)}
.brand svg{flex:none}
.stats{display:flex;gap:6px;overflow-x:auto;min-width:0;max-width:100%;padding-bottom:4px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:3px 10px 4px;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;line-height:1.1;min-width:64px}
.chip small{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.chip b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip.neg b{color:var(--bad)}
.meter{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf);border-radius:2px;transition:width .4s}
.speed{display:flex;gap:4px;margin-left:auto;padding-bottom:4px}
.speed button{width:38px;height:34px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:0 3px 0 var(--ink);cursor:pointer;font-weight:900;font-size:13px;display:grid;place-items:center}
.speed button[aria-pressed="true"]{background:var(--sun)}
.speed button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

#goal{position:fixed;z-index:4;top:calc(var(--hudH) + 6px);left:max(16px,env(safe-area-inset-left,0px));background:rgba(13,59,79,.86);color:var(--paper);
  border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;max-width:min(360px,calc(100vw - 32px));line-height:1.35}
#goal b{color:var(--sun);font-family:var(--display);font-weight:400;letter-spacing:.02em;font-size:13px}
#goal .bars{display:flex;gap:10px;margin-top:4px;font-variant-numeric:tabular-nums}
#goal .bars span{display:flex;align-items:center;gap:5px}
#goal .bars i{display:inline-block;width:60px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
#goal .bars i em{display:block;height:100%;background:var(--sun)}

#toasts{position:fixed;z-index:6;top:calc(var(--hudH) + 72px);left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(340px,calc(100vw - 32px))}
.toast{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;box-shadow:0 3px 0 var(--ink);animation:tin .25s ease-out;line-height:1.35}
.toast.bad{background:#ffe3df}
.toast.good{background:#e1f7e9}
.toast.out{opacity:0;transition:opacity .5s}
@keyframes tin{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}

/* Dock */
#dock{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;
  padding-block:0 calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#dock>*{pointer-events:auto}
#bar{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 5px;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.cat{flex:none;border:2px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:0 3px 0 var(--ink);padding:7px 12px;font-family:var(--display);font-size:15px;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cat svg{flex:none}
.cat[aria-pressed="true"]{background:var(--sun)}
.cat:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#tray{background:var(--paper);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px;max-height:46vh;overflow:auto;max-width:980px}
.trayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.trayhead h2{margin:0;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em}
.trayhead p{margin:0;font-size:12px;color:var(--muted);font-weight:700}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.card{flex:none;width:128px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px 6px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.card:hover{border-color:var(--lagoon)}
.card[aria-pressed="true"]{border-color:var(--ink);background:#fff6cf;box-shadow:0 3px 0 var(--ink)}
.card canvas{width:114px;height:76px;display:block;border-radius:8px;background:linear-gradient(#e6f7fb,#d3f0f6)}
.card .n{font-weight:900;font-size:13px;line-height:1.15}
.card .m{display:flex;flex-direction:column;font-size:11px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.card .m .c{color:var(--ink)}
.card.dis{opacity:.5}

/* Panels inside tray */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.box{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;min-width:0}
.box h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:900}
.big{font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:3px 0;font-variant-numeric:tabular-nums}
.row span:first-child{color:var(--muted)}
.btn{border:2px solid var(--ink);border-radius:10px;background:var(--paper);box-shadow:0 2px 0 var(--ink);padding:5px 10px;font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--sun)}
.btn.red{background:#ffd9d4}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .btn{width:32px;padding:4px 0;text-align:center}
.stepper output{min-width:46px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.hist{display:flex;align-items:flex-end;gap:4px;height:70px;padding-top:6px;border-bottom:1px solid var(--line)}
.hist div{flex:1;min-width:6px;border-radius:3px 3px 0 0;position:relative}
.hist .pos{background:var(--leaf)} .hist .neg{background:var(--coral)}
.histl{display:flex;gap:4px;font-size:10px;color:var(--muted);font-weight:800}
.histl span{flex:1;text-align:center;min-width:6px}
.staffl{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow:auto}
.note{font-size:12px;color:var(--muted);font-weight:700;line-height:1.4;margin:6px 0 0}
.thought{font-size:13px;font-weight:700;padding:3px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.thought:last-child{border:0}

/* Inspector */
#insp{position:fixed;z-index:5;top:calc(var(--hudH) + 8px);right:max(16px,env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - var(--hudH) - 120px);overflow:auto;
  background:var(--paper);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:12px}
#insp .ih{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
#insp h2{margin:0;font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
#insp .sub{font-size:12px;color:var(--muted);font-weight:800}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;padding:0 4px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;border-radius:20px;padding:2px 8px;margin-top:4px}
.pill.ok{background:#d7f3e2;color:var(--good)} .pill.bad{background:#ffdcd8;color:var(--bad)} .pill.warn{background:#ffeccc;color:#a35e00}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:4px}
.need{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted);padding:2px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sec{margin-top:10px;padding-top:8px;border-top:2px dashed var(--line)}
.sec h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:900}

#modal{position:fixed;inset:0;z-index:20;background:rgba(13,59,79,.45);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal .mc{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:22px;max-width:420px;width:100%;text-align:center}
#modal h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 6px;color:var(--lagoon);text-wrap:balance}
#modal p{margin:0 0 14px;font-weight:700;line-height:1.45}

#modal .mc.wide{max-width:800px;text-align:left;max-height:calc(100% - 32px);overflow:auto;padding:18px}
#modal .mc.wide h2{margin:0}
#modal .mc.wide p{margin:0}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.dsub{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 12px!important;line-height:1.4}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.seg{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:var(--sun)}
.dg{display:grid;gap:4px}
.dc{aspect-ratio:1;border:2px solid #b9dfae;border-radius:8px;background:#9bd884;cursor:pointer;font-weight:900;font-size:12px;color:var(--ink);display:grid;place-items:center;padding:0;min-width:0}
.dc.tower{background:#eef2f3;border-color:var(--ink)}
.dc.route{background:var(--c);color:#fff;border-color:var(--ink);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.dc.pool{background:#5fc4e0;border-color:var(--ink);color:#fff}
.dc.next{border-color:var(--lagoon);border-style:dashed;background:#c9efbb}
#dprev{width:100%;aspect-ratio:3/2;border-radius:12px;background:linear-gradient(#e6f7fb,#d3f0f6);display:block}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:8px}
.dctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px}
.dctrl .lab{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:900;display:block;margin-bottom:5px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sun)}
#dName{font:inherit;font-weight:800;border:2px solid var(--ink);border-radius:10px;padding:5px 8px;width:100%;background:#fff;color:var(--ink)}
.dmsg{color:var(--bad);font-weight:800;font-size:13px;min-height:1.3em;margin-top:8px!important}
.dlist{margin-top:14px;padding-top:10px;border-top:2px dashed var(--line)}
.rotbtn{display:inline-flex;align-items:center;gap:6px}
.trayhead .tr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.dcols{grid-template-columns:1fr}}
@media (min-width:721px){.cards{flex-wrap:wrap;overflow:visible}#tray{max-height:min(46vh,430px)}}
@media (max-width:720px){
  .brand{font-size:19px}
  #insp{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);max-height:44vh}
  .speed{margin-left:0}
  #goal{font-size:11px}
  .cat{font-size:14px;padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.meter i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Water park map. Drag to move around, scroll or pinch to zoom."></canvas>

  <header id="hud">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#ffd23f" stroke="#0d3b4f" stroke-width="2.5"/><path d="M3.5 18c3 0 3-2.4 5.8-2.4S12.4 18 15 18s3-2.4 5.8-2.4S24 18 26.5 18v1.5a12 12 0 0 1-23 0z" fill="#1495b8" stroke="#0d3b4f" stroke-width="2"/></svg>

  </div>

  <div id="modal" hidden></div>
</div>

<script>
(()=>{
'use strict';

 bowl:{name:'Whirlpool Bowl',cat:'ride',w:3,h:3,cost:8500,price:7,fair:8,fun:42,dur:14,cap:2,int:8,upkeep:65,water:1,breaks:1,eff:{tired:6},tag:'Thrill 8',top:120},

function designStats(ds){
  const r=ds.route,n=Math.max(0,r.length-1);const seq=[ds.tower,...r];let turns=0,pd=null;

  const fun=clamp(Math.round(6+n*1.8+turns*1.8+ds.H/12+int),8,55);
  const cost=Math.round((1200+n*320+ds.H*25+ds.w*ds.h*120)/50)*50;

}

  const last=r[n-1],f=r[0];
  const path=[[tu+.5+(f[0]-tu)*.36,tv+.5+(f[1]-tv)*.36,H+4]];
  for(let i=0;i<n-1;i++)path.push([r[i][0]+.5,r[i][1]+.5,Math.max(3,H*(1-(i+1)/n))]);

}

    if(!core&&rnd()<0.11)S.tiles[idx(x,y)]=2;

function makeB(type,x,y,rot=0){const d=DEF[type];const[w,h]=dims(type,rot);return{id:S.nid++,type,x,y,w,h,rot,price:d.price||0,open:true,broken:false,closedT:0,rideT:0,dur:d.dur||1,riders:[],queue:[],uses:0,income:0,rel:100,safe:true,fixer:0};}
function rebuild(){
  G=new Map(S.g.map(g=>[g.id,g])); B=new Map(S.b.map(b=>[b.id,b])); ST=new Map(S.st.map(s=>[s.id,s]));
  rebuildMaps();
}
function rebuildMaps(){
  OCC.fill(0);SCENE.fill(0);BIN.fill(0);SHADE.fill(0);ADJ.clear();
  for(const b of S.b){
    for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++)OCC[idx(b.x+i,b.y+j)]=b.id;
    const d=DEF[b.type];
    if(d.scene||d.bin||d.shade){
      const r=d.scene?2:1;
      for(let y=b.y-r;y<=b.y+r;y++)for(let x=b.x-r;x<=b.x+r;x++){if(!inB(x,y))continue;const k=idx(x,y);
        if(d.scene)SCENE[k]=Math.min(9,SCENE[k]+1);
        if(d.shade&&Math.abs(x-b.x)<=1&&Math.abs(y-b.y)<=1)SHADE[k]=1;
        if(d.bin&&Math.abs(x-b.x)<=1&&Math.abs(y-b.y)<=1)BIN[k]=1;}
    }
    if(d.cap)ADJ.set(b.id,adjTiles(b));
  }
}
function adjTiles(b){const r=[];const add=(x,y)=>{if(inB(x,y)&&S.tiles[idx(x,y)]===1)r.push(idx(x,y));};
  for(let i=0;i<b.w;i++){add(b.x+i,b.y-1);add(b.x+i,b.y+b.h);}
  for(let j=0;j<b.h;j++){add(b.x-1,b.y+j);add(b.x+b.w,b.y+j);} return r;}
function rollWeather(){const r=rnd();
  if(r<.55){S.weather='sunny';S.temp=87+(rnd()*8|0);} else if(r<.85){S.weather='cloudy';S.temp=81+(rnd()*6|0);} else {S.weather='rain';S.temp=75+(rnd()*5|0);} }

/* ---------------- pathfinding ---------------- */
const DIST=new Int16Array(N*N), PREV=new Int32Array(N*N), Q=new Int32Array(N*N);
function bfs(start,maxD=9999){
  DIST.fill(-1); if(start<0||S.tiles[start]!==1)return 0;
  DIST[start]=0;PREV[start]=-1;let h=0,t=0;Q[t++]=start;
  while(h<t){const c=Q[h++],d=DIST[c];if(d>=maxD)continue;const x=c%N,y=(c/N)|0;
    if(x>0)vis(c-1);if(x<N-1)vis(c+1);if(y>0)vis(c-N);if(y<N-1)vis(c+N);}
  function vis(n){if(DIST[n]<0&&S.tiles[n]===1){DIST[n]=DIST[Q[h-1]]+1;PREV[n]=Q[h-1];Q[t++]=n;}}
  return t;
}
function recon(t){const p=[];while(DIST[t]>0){p.push(t);t=PREV[t];}return p.reverse();}
function routeTo(e,b){bfs(e.cur);let best=-1,bd=1e9;for(const t of ADJ.get(b.id)||[]){const d=DIST[t];if(d>=0&&d<bd){bd=d;best=t;}}
  if(best<0)return false;e.path=recon(best);return true;}
function nearestPath(from){const fx=from%N,fy=(from/N)|0;let best=-1,bd=1e9;
  for(let i=0;i<N*N;i++)if(S.tiles[i]===1){const d=Math.abs(i%N-fx)+Math.abs(((i/N)|0)-fy);if(d<bd){bd=d;best=i;}}return best;}
function stepMove(e,spd,dtm){
  let mv=spd*dtm;
  while(mv>0&&e.path.length){
    const t=e.path[0];if(S.tiles[t]!==1){e.path=[];break;}
    const cx=t%N+.5,cy=((t/N)|0)+.5,dx=cx-e.x,dy=cy-e.y,d=Math.hypot(dx,dy);
    if(d<=mv){e.x=cx;e.y=cy;mv-=d;e.prev=e.cur;e.cur=t;e.path.shift();}
    else{e.x+=dx/d*mv;e.y+=dy/d*mv;mv=0;}
  }
  return e.path.length===0;
}
function wander(e){
  const x=e.cur%N,y=(e.cur/N)|0,n=[];
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(inB(nx,ny)&&S.tiles[idx(nx,ny)]===1)n.push(idx(nx,ny));}
  if(!n.length){e.pause=3;return;}
  let c=n.filter(t=>t!==e.prev);if(!c.length)c=n;
  e.path=[pick(c)];
}
function relocate(e){const n=nearestPath(e.cur);if(n<0)return false;e.cur=n;e.prev=-1;e.x=n%N+.5;e.y=((n/N)|0)+.5;e.path=[];return true;}

function think(g,t){if(g.th[0]===t)return;g.th.unshift(t);if(g.th.length>5)g.th.pop();}
function needs(g,dtm,inside){
  const w=S.weather;
  g.hunger+=.13*dtm;g.thirst+=(w==='sunny'?.2:.13)*dtm;g.bladder+=.1*dtm;g.tired+=.07*dtm;
  if(!inside){let sr=w==='sunny'?.22:w==='cloudy'?.08:0;if(SHADE[g.cur])sr*=.3;g.sun+=sr*dtm;}
  g.hunger=Math.min(100,g.hunger);g.thirst=Math.min(100,g.thirst);g.bladder=Math.min(100,g.bladder);g.tired=Math.min(100,g.tired);g.sun=Math.min(100,g.sun);
  let dh=0;
  if(g.hunger>80)dh-=.12;if(g.thirst>80)dh-=.12;if(g.bladder>80){dh-=.18;if(rnd()<.01)think(g,'I really need a restroom');}
  if(g.sun>85){dh-=.12;if(rnd()<.01)think(g,"I'm getting sunburned");}
  if(g.tired>85)dh-=.08;
  if(!inside){
    if(S.litter[g.cur]>=2){dh-=.25;if(rnd()<.02)think(g,'This path is covered in litter');}
    dh+=Math.min(SCENE[g.cur],4)*.03;
    if(g.trash){g.trashT+=dtm;if(BIN[g.cur])g.trash=0;else if(g.trashT>20){S.litter[g.cur]=Math.min(5,S.litter[g.cur]+1);g.trash=0;}}
    else if(rnd()<.0008*dtm)S.litter[g.cur]=Math.min(5,S.litter[g.cur]+1);
  }
  if(w==='rain')dh-=.03;
  g.hap=clamp(g.hap+dh*dtm,0,100);
}
function updGuest(g,dtm){
  if(g.state==='ride'||g.state==='queue'){
    needs(g,dtm,true);
    if(g.state==='queue'){g.waitT+=dtm;if(g.waitT>50){const b=B.get(g.at);if(b)b.queue=b.queue.filter(i=>i!==g.id);g.state='walk';g.at=0;g.hap-=8;think(g,'I waited ages in that line');wander(g);}}
    return;
  }
  needs(g,dtm,false);g.inPark+=dtm;
  if(S.tiles[g.cur]!==1&&!relocate(g)){g.dead=1;return;}
  if(g.pause>0){g.pause-=dtm;return;}
  if(stepMove(g,g.state==='leave'?.62:.5,dtm))arrive(g);
}
function arrive(g){
  if(g.state==='leave'){if(g.cur===ENTI){g.dead=1;return;}setLeave(g);return;}
  if(g.goal){const b=B.get(g.goal);g.goal=0;if(b&&(ADJ.get(b.id)||[]).includes(g.cur)){tryEnter(g,b);return;}}
  decide(g);
}
function setLeave(g){
  g.state='leave';g.goal=0;
  if(g.cur===ENTI){g.dead=1;return;}
  bfs(g.cur);if(DIST[ENTI]<0){g.dead=1;return;}
  g.path=recon(ENTI);
}
function decide(g){
  if(g.cash<5&&!g.atmT&&S.min<540){g.atmT=1;if(seek(g,'cash'))return;}
  if(S.min>=540||g.hap<12||g.inPark>g.stay||(g.cash<2&&rnd()<.3)){
    if(g.hap<12)think(g,'I want to go home');else if(S.min<540)think(g,'What a day. Time to head home');
    setLeave(g);return;
  }
  if(S.min-g.lastSeek>6){
    let want=null;
    if(g.bladder>70)want='bladder';else if(g.thirst>65)want='thirst';else if(g.hunger>65)want='hunger';
    else if(g.sun>70)want='sun';else if(g.tired>75)want='tired';
    if(!want&&!g.lockT&&g.inPark<40){g.lockT=1;if(rnd()<.55)want='locker';}
    if(!want&&rnd()<.6)want='fun';
    if(want){g.lastSeek=S.min;if(seek(g,want))return;}
  }
  wander(g);
}
const NEED_MSG={bladder:"I can't find a restroom",thirst:"I'm thirsty and there's nowhere to get a drink",hunger:"I'm hungry. Where's the food?",sun:"I need sunscreen",tired:'I need somewhere to sit down',fun:'',cash:"I'm out of money and there's no ATM",locker:''};
function seek(g,want){
  const cand=[];
  for(const b of S.b){const d=DEF[b.type];if(!d.cap||!b.open||b.broken||b.closedT>0||b.price>g.cash)continue;
    if(want==='fun'){if(d.cat!=='ride'||d.int>g.tol+1)continue;}
    else if(want==='cash'){if(!d.atm)continue;}else if(want==='locker'){if(!d.locker)continue;}
    else if(!(d.eff&&d.eff[want]<0))continue;
    if(want==='tired'&&d.cat==='ride'&&d.int>g.tol+1)continue;
    cand.push(b);}
  if(!cand.length){if(NEED_MSG[want]){think(g,NEED_MSG[want]);g.hap-=1.5;}return false;}
  bfs(g.cur);
  let best=null,bt=-1,bs=-1e9;
  for(const b of cand){let md=1e9,mt=-1;for(const t of ADJ.get(b.id)||[]){const d=DIST[t];if(d>=0&&d<md){md=d;mt=t;}}
    if(mt<0)continue;const d=DEF[b.type];
    const sc=want==='fun'?d.fun-(g.ridden[b.id]||0)*14-md*.6+rnd()*12-b.queue.length/d.cap*4:-md+rnd()*2;
    if(sc>bs){bs=sc;best=b;bt=mt;}}
  if(!best){if(NEED_MSG[want])think(g,NEED_MSG[want]);return false;}
  g.goal=best.id;g.path=recon(bt);return true;
}
function tryEnter(g,b){
  const d=DEF[b.type];
  if(!b.open||b.broken||b.closedT>0){think(g,`The ${d.name} is closed`);g.hap-=2;return wander(g);}
  if(b.price>g.cash){think(g,`I can't afford the ${d.name}`);return wander(g);}
  if(d.fair&&b.price>d.fair*1.6){think(g,`The ${d.name} is way too expensive`);g.hap-=3;return wander(g);}
  if(b.queue.length>=d.cap*3){think(g,`The line for the ${d.name} is too long`);g.hap-=1;return wander(g);}
  if(d.fair&&b.price<=d.fair*.6&&b.price>0){think(g,`The ${d.name} is a bargain`);g.hap+=2;}
  g.cash-=b.price;g.spent+=b.price;b.income+=b.price;earn(b.price,b.price?b:null);

}
function exitTo(g,b){
  const adj=ADJ.get(b.id)||[];
  if(!adj.includes(g.cur)){if(adj.length){const t=pick(adj);g.cur=t;g.x=t%N+.5;g.y=((t/N)|0)+.5;}else relocate(g);}
  g.state='walk';g.at=0;g.path=[];g.prev=-1;
}
function ejectAll(b,msg,loss){
  for(const id of [...b.riders,...b.queue]){const g=G.get(id);if(!g)continue;exitTo(g,b);g.hap=clamp(g.hap-loss,0,100);if(msg)think(g,msg);}
  b.riders=[];b.queue=[];b.rideT=0;
}

/* ---------------- buildings ---------------- */
function updB(b,dtm){
  const d=DEF[b.type];if(!d.cap)return;
  if(b.closedT>0){b.closedT=Math.max(0,b.closedT-dtm);}
  if(b.rideT>0){b.rideT-=dtm;if(b.rideT<=0)finish(b);return;}
  if(b.queue.length&&b.open&&!b.broken&&!b.closedT){
    b.riders=b.queue.splice(0,Math.min(d.cap,b.queue.length));
    for(const id of b.riders){const g=G.get(id);if(g){g.state='ride';g.rx=rnd();g.ry=rnd();g.rph=rnd()*6.283;}}
    b.rideT=b.dur=d.dur;
    if(d.breaks){b.rel=Math.max(15,b.rel-.6);if(rnd()<Math.max(0,88-b.rel)/260){breakDown(b);return;}}
    if(d.water&&!b.safe&&rnd()<.025)incident(b);

}
function finish(b){
  const d=DEF[b.type];
  for(const id of b.riders){const g=G.get(id);if(!g)continue;
    for(const k in (d.eff||{}))g[k]=clamp(g[k]+d.eff[k],0,100);
    if(d.cat==='ride'){const m=d.int>=g.tol-4?1:.6;const gain=d.fun*.55*m;g.hap=clamp(g.hap+gain,0,100);
      g.ridden[b.id]=(g.ridden[b.id]||0)+1;
      think(g,gain>16?`The ${d.name} was amazing!`:m<1?`The ${d.name} was a bit tame`:`The ${d.name} was fun`);}
    else{g.hap=clamp(g.hap+(d.fun||0)+3,0,100);if(d.trash){g.trash=1;g.trashT=0;}
      if(d.cat==='food')think(g,d.eff.hunger?'That hit the spot':'So refreshing');
      if(d.atm){g.cash+=40;g.atmT=0;earn(1,b);think(g,'Got more cash from the ATM');}
      if(d.locker){g.hap=clamp(g.hap+6,0,100);think(g,'My stuff is safe in a locker');}
      if(d.aid){if(g.hap<55)g.hap=clamp(g.hap+15,0,100);think(g,'The first aid staff sorted out my sunburn');}
      if(b.type==='cabana')think(g,'The cabana was worth every penny');}
    exitTo(g,b);}
  b.uses+=b.riders.length;b.riders=[];b.rideT=0;
}
function breakDown(b){
  const d=DEF[b.type];b.broken=true;

  news(`${d.name} has broken down.${S.st.some(s=>s.role==='mechanic')?' A mechanic is on the way.':' Hire a mechanic to fix it.'}`,'bad');
}
function incident(b){
  const d=DEF[b.type];b.closedT=60;S.incidents++;
  ejectAll(b,`Someone nearly drowned at the ${d.name}!`,15);
  S.rating=Math.max(0,S.rating-70);
  news(`A swimmer had to be pulled out at the ${d.name}. It's closed for an hour. Hire lifeguards!`,'bad');
}
function canPlace(type,x,y,r=0){
  const[w,h]=dims(type,r);
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const X=x+i,Y=y+j;if(!inB(X,Y))return false;const k=idx(X,Y);
    if(S.tiles[k]===1||OCC[k]||RESERVED.has(k))return false;}
  return true;
}
function treesIn(type,x,y,r=0){let n=0;const[w,h]=dims(type,r);for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(S.tiles[idx(x+i,y+j)]===2)n++;return n;}
function build(type,x,y,r=0){
  const d=DEF[type];const[bw,bh]=dims(type,r);
  if(!canPlace(type,x,y,r)){news("You can't build there.");return false;}
  const cost=d.cost+treesIn(type,x,y,r)*TREE_COST;
  if(S.cash<cost){news(`Not enough cash. The ${d.name} costs ${fmt$(cost)}.`,'bad');return false;}
  for(let j=0;j<bh;j++)for(let i=0;i<bw;i++)S.tiles[idx(x+i,y+j)]=0;
  spend(cost);const b=makeB(type,x,y,r);S.b.push(b);B.set(b.id,b);rebuildMaps();
  floaters.push({x:x+bw/2,y:y+bh/2,t:0,s:'-'+fmt$(cost),neg:1});
  if(d.cap&&!(ADJ.get(b.id)||[]).length)news(`The ${d.name} needs a path next to it so guests can get in.`);
  return true;
}
function demolish(b,refund=true){
  const d=DEF[b.type];ejectAll(b,`The ${d.name} was torn down`,4);
  S.b=S.b.filter(o=>o!==b);B.delete(b.id);
  for(const s of S.st)if(s.job===b.id){s.job=0;s.path=[];}
  if(refund){const r=Math.round(d.cost*.5);S.cash+=r;S.today.inc+=r;floaters.push({x:b.x+b.w/2,y:b.y+b.h/2,t:0,s:'+'+fmt$(r)});}

}
function placePath(t){
  if(t<0||S.tiles[t]===1||OCC[t]||(RESERVED.has(t)&&t!==ENTI))return;
  const cost=PATH_COST+(S.tiles[t]===2?TREE_COST:0);
  if(S.cash<cost){news('Not enough cash for more path.','bad');return;}
  spend(cost);S.tiles[t]=1;rebuildMaps();
}
function bulldoze(t){
  if(t<0)return;

  if(t===ENTI){news('The entrance path has to stay.');return;}
  if(S.tiles[t]===1){S.tiles[t]=0;S.litter[t]=0;rebuildMaps();return;}
  if(S.tiles[t]===2){if(S.cash<TREE_COST)return news('Not enough cash to clear that tree.','bad');spend(TREE_COST);S.tiles[t]=0;}
}

/* ---------------- staff ---------------- */
function hire(role){
  const s={id:S.gid++,role,name:pick(FIRST),x:ENT.x+.5,y:ENT.y+.5,cur:ENTI,prev:-1,path:[],busy:0,job:0,task:'Patrolling',ox:(rnd()-.5)*.3,oy:(rnd()-.5)*.3};
  S.st.push(s);ST.set(s.id,s);news(`Hired ${s.name} as a ${STAFF[role].name.toLowerCase()} (${fmt$(STAFF[role].wage)} a day).`,'good');
}
function fire(s){S.st=S.st.filter(o=>o!==s);ST.delete(s.id);for(const b of S.b)if(b.fixer===s.id)b.fixer=0;if(sel&&sel.kind==='s'&&sel.id===s.id)select(null);}
function updStaff(s,dtm){
  if(S.tiles[s.cur]!==1&&!relocate(s))return;
  if(s.busy>0){s.busy-=dtm;if(s.busy<=0){s.busy=0;
      if(s.role==='janitor'){S.litter[s.cur]=0;s.task='Patrolling';}
      else if(s.role==='mechanic'){const b=B.get(s.job);if(b){const wb=b.broken;b.broken=false;b.rel=Math.min(100,b.rel+(wb?45:25));b.fixer=0;if(wb)news(`${DEF[b.type].name} is running again.`,'good');}s.job=0;s.task='Patrolling';}}
    return;}
  if(!stepMove(s,.72,dtm))return;
  if(s.role==='janitor'){
    if(S.litter[s.cur]>0){s.busy=2.5;s.task='Sweeping';return;}
    const n=bfs(s.cur,14);for(let i=1;i<n;i++){const t=Q[i];if(S.litter[t]>0){s.path=recon(t);s.task='Heading to litter';return;}}
    s.task='Patrolling';wander(s);
  }else if(s.role==='mechanic'){
    let b=s.job?B.get(s.job):null;
    if(b&&(ADJ.get(b.id)||[]).includes(s.cur)){s.busy=b.broken?10:5;s.task=(b.broken?'Fixing ':'Inspecting ')+DEF[b.type].name;return;}
    if(!b){b=S.b.find(o=>o.broken&&(!o.fixer||!ST.has(o.fixer)));
      if(!b&&rnd()<.25)b=S.b.filter(o=>DEF[o.type].breaks&&o.rel<75&&!o.fixer).sort((a,c)=>a.rel-c.rel)[0];
      if(b){b.fixer=s.id;s.job=b.id;}}
    if(b&&routeTo(s,b)){s.task=(b.broken?'Going to fix ':'Going to inspect ')+DEF[b.type].name;return;}
    if(b){b.fixer=0;s.job=0;}
    s.task='Patrolling';wander(s);
  }else{
    if(rnd()<.18){const w=S.b.filter(o=>DEF[o.type].water);if(w.length){const b=pick(w);if(routeTo(s,b)){s.task='Watching the '+DEF[b.type].name;return;}}}
    if(!s.task.startsWith('Watching'))s.task='Patrolling';
    wander(s);
  }
}
function coverage(){
  const guards=S.st.filter(s=>s.role==='lifeguard');
  for(const b of S.b){if(!DEF[b.type].water)continue;
    b.safe=guards.some(s=>{const gx=s.cur%N,gy=(s.cur/N)|0;const dx=Math.max(b.x-gx,0,gx-(b.x+b.w-1)),dy=Math.max(b.y-gy,0,gy-(b.y+b.h-1));return Math.max(dx,dy)<=7;});}
}

/* ---------------- simulation ---------------- */
function attraction(){let a=0;for(const b of S.b){const d=DEF[b.type];if(d.cat==='ride'&&b.open&&!b.broken)a+=d.fun;}return a;}
function spawnTick(dtm){
  if(S.min>=480)return;
  const a=attraction();
  const fair=4+a/25;const feeM=clamp(1.15-(S.fee-fair)/(fair*1.2),.05,1.3);
  const wM={sunny:1.25,cloudy:.9,rain:.4}[S.weather];
  const rM=.5+S.rating/1000;
  const tM=S.min<60?.5+S.min/120:S.min>400?.6:1;
  const lam=(.06+a/350)*wM*rM*feeM*tM;
  if(S.g.length>=40+a*2.6)return;
  let k=lam*dtm;while(k>0){if(rnd()<Math.min(k,1))spawnGuest();k-=1;}
}
function calcRating(){
  const n=S.g.length;let avg=65;if(n)avg=S.g.reduce((s,g)=>s+g.hap,0)/n;
  let lit=0;for(let i=0;i<N*N;i++)lit+=S.litter[i];
  const rides=S.b.filter(b=>DEF[b.type].cat==='ride');const types=new Set(rides.map(b=>b.type)).size;
  const broken=S.b.filter(b=>b.broken).length;const scen=S.b.filter(b=>DEF[b.type].scene).length;
  return clamp(170+avg*4.4+Math.min(rides.length,12)*12+types*12-lit*3-broken*40+Math.min(scen,40)*1.6,0,999);
}
function step(s){
  S.min+=s;
  if(S.min>=540&&!S.closing){S.closing=true;for(const g of S.g)if(g.state==='walk'){g.goal=0;setLeave(g);}news('6:00 PM. The park is closing and guests are heading home.');}
  spawnTick(s);
  for(const b of S.b)updB(b,s);
  for(const g of S.g)if(!g.dead)updGuest(g,s);
  if(S.g.some(g=>g.dead)){for(const g of S.g)if(g.dead){G.delete(g.id);if(sel&&sel.kind==='g'&&sel.id===g.id)select(null);}S.g=S.g.filter(g=>!g.dead);}
  for(const st of S.st)updStaff(st,s);
  coverage();
  S.peak=Math.max(S.peak,S.g.length);
  S.rAcc+=s;if(S.rAcc>=5){S.rAcc=0;S.rating+=(calcRating()-S.rating)*.12;
    if(!S.won&&S.day<=GOAL.day&&S.g.length>=GOAL.guests&&S.rating>=GOAL.rating){S.won=true;showModal('Park of the Summer!',`You hit ${GOAL.guests} guests with a rating of ${Math.round(S.rating)} on day ${S.day}. Keep building — the park is yours.`,'Keep playing');}}

function endDay(){
  const wages=S.st.reduce((a,s)=>a+STAFF[s.role].wage,0),up=S.b.reduce((a,b)=>a+(DEF[b.type].upkeep||0),0),int=Math.round(S.loan*.01);
  spend(wages+up+int);
  S.hist.push({day:S.day,inc:Math.round(S.today.inc),exp:Math.round(S.today.exp),vis:S.today.vis});if(S.hist.length>10)S.hist.shift();
  news(`Day ${S.day} report: ${S.today.vis} visitors, earned ${fmt$(S.today.inc)}, spent ${fmt$(S.today.exp)}.`,S.today.inc>=S.today.exp?'good':'bad');
  for(const b of S.b){b.queue=[];b.riders=[];b.rideT=0;}
  S.g=[];G.clear();if(sel&&sel.kind==='g')select(null);
  S.day++;S.min=0;S.closing=false;S.today={inc:0,exp:0,vis:0};
  rollWeather();
  if(!S.won&&!S.missed&&S.day>GOAL.day){S.missed=true;showModal('Summer goal missed',`The goal was ${GOAL.guests} guests at once with a rating of ${GOAL.rating} by day ${GOAL.day}. Keep building to get there anyway.`,'Keep building');}
  setTimeout(()=>news(`Day ${S.day}: ${wxLabel()} today.`),400);
  save();
}

function deck(b,col='#eef5f3'){rect(b.x,b.y,b.x+b.w,b.y+b.h,0,col,'#c6d8d5');

function tubePath(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);

    case 'fire':{const s=ST.get(+arg);if(s){fire(s);news(`${s.name} has left the park staff.`);}renderTray();if(sel&&sel.kind==='s')renderInsp();break;}
    case 'fireSel':{const s=ST.get(sel.id);if(s){fire(s);news(`${s.name} has left the park staff.`);if(cat==='staff')renderTray();}break;}
    case 'fee':S.fee=clamp(S.fee+(+arg),0,40);break;
    case 'borrow':if(S.loan<50000){S.loan+=5000;S.cash+=5000;news('Borrowed $5,000 at 1% interest a day.');}break;
    case 'repay':if(S.loan>=5000&&S.cash>=5000){S.loan-=5000;S.cash-=5000;news('Repaid $5,000 of the loan.','good');}else news('You need $5,000 in cash to repay.','bad');break;
    case 'newPark':tray.querySelector('[data-np]').hidden=false;break;
    case 'npNo':tray.querySelector('[data-np]').hidden=true;break;
    case 'npYes':select(null);newGame();centerCam();save();openCat('park');news('A fresh plot of beachfront land. Good luck!');break;
    case 'save':save();news('Park saved in this browser.','good');break;
  }
  FV=null;updFields(insp);updFields(tray);
}

  if(sel&&sel.kind==='g'){const g=G.get(sel.id);if(g){bars.hap=[g.hap,g.hap<30?'var(--bad)':g.hap<55?'var(--warn)':'var(--leaf)'];

  const saved=ctx;ctx=pc;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);
  const sc=Math.min(1.6,300/((D.w+D.h)*HW),190/((D.w+D.h)*HH+D.H+24));const ctr=iso(D.w/2,D.h/2);
  ctx.setTransform(sc*2,0,0,sc*2,340-ctr[0]*sc*2,(226+(D.H+24)*sc*.95)-ctr[1]*sc*2);
  for(let j=0;j<D.h;j++)for(let i=0;i<D.w;i++)rect(i,j,i+1,j+1,0,grass(i+3,j+5));
  dSlide({type:'__p',x:0,y:0,w:D.w,h:D.h,rot:0,riders:[],queue:[],rideT:0,dur:1},T,customCfg(D));
  ctx=saved;
}
function dAct(a,arg){
  if(!D)return;
  switch(a){
    case 'cancel':D=null;modalEl.hidden=true;return;
    case 'mode':D.mode=arg;break;
    case 'undo':if(D.route.length)D.route.pop();break;
    case 'clear':D.route=[];D.mode='route';break;
    case 'col':D.col=arg;break;
    case 'H':D.H=clamp(D.H+(+arg),60,180);break;
    case 'w':case 'h':{const k=a;D[k]=clamp(D[k]+(+arg),2,6);
      const ok=c=>c[0]<D.w&&c[1]<D.h;if(!ok(D.tower)){D.tower=[0,0];D.route=[];}
      const cut=D.route.findIndex(c=>!ok(c));if(cut>=0)D.route=D.route.slice(0,cut);break;}
    case 'cell':{const[u,v]=arg.split(',').map(Number);
      if(D.mode==='tower'){if(!D.route.some(c=>c[0]===u&&c[1]===v)||true){D.tower=[u,v];D.route=[];D.mode='route';}break;}
      const r=D.route,L=r.length?r[r.length-1]:D.tower;
      if(r.length&&L[0]===u&&L[1]===v)r.pop();
      else if(u===D.tower[0]&&v===D.tower[1])D.msg='That square is the tower. Use Move tower to put it somewhere else.';
      else if(r.some(c=>c[0]===u&&c[1]===v))D.msg='The slide already passes through that square.';
      else if(Math.abs(L[0]-u)+Math.abs(L[1]-v)!==1)D.msg='Pick a square right next to the end of the slide (dashed outline).';
      else r.push([u,v]);
      break;}
    case 'del':{S.designs=S.designs.filter(d=>d.id!==arg);delete DEF[arg];CFG.delete(arg);delete previews[arg];if(tool===arg)setTool('select');if(cat==='ride')renderTray();break;}
    case 'save':{
      if(D.route.length<2){D.msg='Lay at least one slide section and a splash pool square.';break;}
      const name=(D.name||'').trim()||('Custom Slide '+S.dsid);
      const ds={id:'c'+(S.dsid++),name,w:D.w,h:D.h,H:D.H,col:D.col,tower:[...D.tower],route:D.route.map(c=>[...c])};
      S.designs.push(ds);registerDesign(ds);D=null;modalEl.hidden=true;
      if(cat!=='ride')openCat('ride');else renderTray();setTool(ds.id);rot=0;
      news(`${ds.name} saved. Click the map to place it, R to rotate.`,'good');save();return;}
  }
  renderDesigner();
}
modalEl.addEventListener('click',e=>{const a=e.target.closest('[data-dact]');if(a)dAct(a.dataset.dact,a.dataset.arg);});
modalEl.addEventListener('input',e=>{if(e.target.id==='dName'&&D)D.name=e.target.value.slice(0,24);});
addEventListener('keydown',e=>{if(e.key==='Escape'&&D){D=null;modalEl.hidden=true;}});

/* ---------------- save / boot ---------------- */
const KEY='splashworks-save-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return null;}
function centerCam(){const c=iso(20,32);cam.x=c[0];cam.y=c[1];cam.z=innerWidth<600?.8:1.05;}
let last=performance.now(),uiAcc=0,saveAcc=0,booted=false;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;if(!RM)T+=dt;else T+=dt*.15;
  if(S.speed){let m=dt*3*S.speed;while(m>0){const s=Math.min(m,1);step(s);m-=s;}}
  for(const f of floaters)f.t+=dt;floaters=floaters.filter(f=>f.t<4);
  draw();
  if(D&&!modalEl.hidden)drawDPreview();
  uiAcc+=dt;if(uiAcc>.25){uiAcc=0;FV=null;updHUD();updFields(insp);updFields(tray);}
  saveAcc+=dt;if(saveAcc>30){saveAcc=0;save();}
  requestAnimationFrame(frame);
}
function start(data){
  if(booted)return;booted=true;
  const s=(data&&data.state)||load();
  if(s&&s.v===1&&Array.isArray(s.tiles)){S=s;S.designs=S.designs||[];S.dsid=S.dsid||1;S.designs.forEach(registerDesign);rebuild();}else{newGame();setTimeout(()=>{news('Welcome to Splashworks! Your beachfront park opens at 9:00 AM.');setTimeout(()=>news('Open Paths to lay deck, then Pools & Slides to add rides beside it.'),2500);setTimeout(()=>news('Pools need lifeguards. Hire one from Staff before the crowds arrive.'),5000);},300);}
  resize();centerCam();setSpeed(S.speed??1);openCat('select');updHUD();
  requestAnimationFrame(t=>{last=t;frame(t);});
}
addEventListener('resize',()=>{resize();});
start({});
})();
</script>
